name: Build GhostBrowser IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' -e 's/objectVersion = [0-9]*/objectVersion = 56/' GhostBrowser.xcodeproj/project.pbxproj || true

      - name: Build App (Release - iphoneos)
        run: |
          xcodebuild -project GhostBrowser.xcodeproj \
            -scheme GhostBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GhostBrowser.app Payload/
          zip -qr GhostBrowser.ipa Payload
          echo "GhostBrowser.ipa packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowser-IPA
          path: GhostBrowser.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.9.0
          name: GhostBrowser v2.9.0 (Dynamic GPS Location Engine & Virtual Camera Media Stream Injection)
          body: |
            ## GhostBrowser v2.9.0
            - **Dynamic Geolocation (GPS) Simulation Engine**:
              - Realistic HTML5 `navigator.geolocation.getCurrentPosition` & `watchPosition` interception.
              - Natural Assisted GPS / Wi-Fi drift simulation (±0.000015° micro-jitter) and realistic sensor response latency (50–130ms).
              - Quick City Presets (New York, San Francisco, Los Angeles, Miami, Chicago, London, Tokyo, Toronto) + custom coordinates.
              - Live coordinate injection into active web session with **zero page reload**.
            - **Virtual Camera & WebRTC Media Stream Injection**:
              - Intercepts `navigator.mediaDevices.getUserMedia({ video: true })` using native WebKit `HTMLCanvasElement.captureStream(30)`.
              - Photo Library picker to stream custom images/frames directly into websites with 60 FPS fluidity.
              - Sleek FaceTime camera card placeholder when no custom media is loaded.
              - Combined audio destination for seamless WebRTC constraint resolution.
            - **Session Media & Sensors In-Browser HUD**:
              - Accessible right from top toolbar via native `.presentationDetents([.medium, .large])` half-sheet drawer.
              - Users can see the live webpage directly above while adjusting framing, pan (X/Y), zoom (0.5x–3.0x), or GPS coordinates below without navigating away!
              - Interactive drag-to-pan directly on the live viewfinder preview box.
            - **2026 Flagship Hardware Catalog**:
              - iPhone 18 Pro Max (A20 Pro), iPhone 17 Pro Max (A19 Pro), iPhone 16 Pro Max, iPad Pro M4, MacBook Pro M4 Max, Native Host Device.
          files: GhostBrowser.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
