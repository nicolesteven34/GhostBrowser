name: Build GhostBrowser IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' -e 's/objectVersion = [0-9]*/objectVersion = 56/' GhostBrowser.xcodeproj/project.pbxproj || true

      - name: Build App (Release - iphoneos)
        run: |
          xcodebuild -project GhostBrowser.xcodeproj \
            -scheme GhostBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GhostBrowser.app Payload/
          zip -qr GhostBrowser.ipa Payload
          echo "GhostBrowser.ipa packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowser-IPA
          path: GhostBrowser.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.8.0
          name: GhostBrowser v1.8.0 (Live Hardware Visitor ID & Homepage Identity Hub)
          body: |
            ## GhostBrowser v1.8.0 (Live Hardware Visitor ID & Homepage Identity Hub)
            - **Live Hardware Visitor ID Engine**: Cryptographically generates an authentic 20-character uppercase alphanumeric Visitor ID (matching Fingerprint.com format) derived from Canvas, Audio, Screen, WebGL, Platform, and Identity Seed.
            - **Homepage Identity Hub**: The offline start page (`local://startpage`) now features a prominent Visitor ID card with single-tap clipboard copy, live device metrics, and an interactive "Regenerate Identity (✨)" action.
            - **Synchronized Rotation**: Tapping Sparkles or Regenerate dynamically updates the Visitor ID on the start page, triggers an in-place session wipe, and translates to a fresh Visitor ID on Fingerprint.com.
            - **Settings Modal Integration**: Displays the active formatted Visitor ID with a one-tap copy button in the Browser Persona & Privacy sheet.
          files: GhostBrowser.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
