name: Build GhostBrowser IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' -e 's/objectVersion = [0-9]*/objectVersion = 56/' GhostBrowser.xcodeproj/project.pbxproj || true

      - name: Build App (Release - iphoneos)
        run: |
          xcodebuild -project GhostBrowser.xcodeproj \
            -scheme GhostBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GhostBrowser.app Payload/
          zip -qr GhostBrowser.ipa Payload
          echo "GhostBrowser.ipa packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowser-IPA
          path: GhostBrowser.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.5.0
          name: GhostBrowser v1.5.0 (Full Multi-Signal Hardware Entropy Engine)
          body: |
            ## GhostBrowser v1.5.0 (Full Multi-Signal Hardware Entropy Engine)
            - **Multi-Signal Hardware Seeding**: Seeds AudioContext (dynamics compressor buffer), 2D Canvas (toDataURL and getImageData), Screen Dimensions (Screen.prototype), and WebGL GPU renderer deterministically per persona.
            - **Unique Visitor ID Generation**: Defeats Fingerprint.com's server-side ML linking graph by simultaneously altering Audio, Canvas, Screen, and Platform entropy.
            - **Zero AST Tampering Flags**: All wrappers use WeakMap-backed `Function.prototype.toString` and prototype accessors, leaving `Object.getOwnPropertyNames(navigator)` pristine with 0 own properties.
            - **Auto-Purge Storage & 1-Tap Sparkles Action**: Nukes all cookies, IndexedDB, and localStorage on demand or profile switch.
          files: GhostBrowser.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
