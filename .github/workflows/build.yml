name: Build GhostBrowser IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' -e 's/objectVersion = [0-9]*/objectVersion = 56/' GhostBrowser.xcodeproj/project.pbxproj || true

      - name: Build App (Release - iphoneos)
        run: |
          xcodebuild -project GhostBrowser.xcodeproj \
            -scheme GhostBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GhostBrowser.app Payload/
          zip -qr GhostBrowser.ipa Payload
          echo "GhostBrowser.ipa packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowser-IPA
          path: GhostBrowser.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.9.0
          name: GhostBrowser v1.9.0 (Same-Device Unique Identity Engine)
          body: |
            ## GhostBrowser v1.9.0 (Same-Device Unique Identity Engine)
            - **Same-Device Unique Identity Engine**: Generating a new identity under the *same* Apple device profile (e.g. iPad Pro) now reliably generates a brand new Visitor ID on Fingerprint.com.
            - **Multi-Dimension Canvas Seeding**: WeakMap `seededCanvasSessions` seeds both text (240×60) and geometry (122×110) canvas images with deterministic single-seed guards, guaranteeing 100% bit-consistency (`hash1 === hash2`) and 0 Artificial Noise flags.
            - **High-Entropy Continuous Audio Modulation**: Smooth sine wave modulation shifts the FingerprintJS audio sample sum by >0.05 (50× the float binning threshold), reliably producing distinct audio hashes across seeds.
            - **Authentic Apple OS Build & Display Zoom Variance**: Incorporates realistic Apple minor OS builds (17.5, 17.5.1, 17.6, 17.6.1, 17.4.1) and display scaling (Standard vs Zoomed) for genuine in-family variation.
            - **Auto-Dismissing Actions**: Tapping identity rotation in Settings immediately dismisses the modal and triggers an in-place session wipe and cache-busting reload of the active page.
          files: GhostBrowser.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
