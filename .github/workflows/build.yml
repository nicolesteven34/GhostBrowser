name: Build GhostBrowser IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' -e 's/objectVersion = [0-9]*/objectVersion = 56/' GhostBrowser.xcodeproj/project.pbxproj || true

      - name: Build App (Release - iphoneos)
        run: |
          xcodebuild -project GhostBrowser.xcodeproj \
            -scheme GhostBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GhostBrowser.app Payload/
          zip -qr GhostBrowser.ipa Payload
          echo "GhostBrowser.ipa packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowser-IPA
          path: GhostBrowser.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.2.0
          name: GhostBrowser v2.2.0 (Multi-Realm Synchronized Stealth Engine & Dynamic Identity Architecture)
          body: |
            ## GhostBrowser v2.2.0 (Multi-Realm Synchronized Stealth Engine)
            - **Multi-Realm Prototype Synchronization**:
              - Automatically synchronizes all iframes (dynamic, `about:blank`, `contentWindow`, `contentDocument`) with the active persona.
              - Eliminates cross-realm contradictions (`isIframePlatformSameAsMainJs: true`, `isIframeHardwareConcurrencySameAsMainJs: true`).
              - Native AST preservation: `Function.prototype.toString` returns `[native code]` across all realms with `hasOwnProperty('prototype') === false`.
            - **Authentic Desktop Safari on iPad**:
              - iPad Pro profile configured to match real iPadOS Desktop Safari by default (`MacIntel`, Macintosh User-Agent, desktop viewport, 5 touch points).
              - Guarantees alignment between WebKit C++ engine and client-side JavaScript.
            - **Deterministic Bit-Consistent Canvas Farbling**:
              - Modulates canvas once per dimension per session seed, ensuring `hash1 === hash2` (0 Artificial Noise).
              - Changes canvas hash on identity rotation, forcing Fingerprint Pro to assign fresh visitor IDs on the same physical device.
              - Added navigation throttles to start page action buttons for silky-smooth identity transitions.
          files: GhostBrowser.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
