name: Build GhostBrowser IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' -e 's/objectVersion = [0-9]*/objectVersion = 56/' GhostBrowser.xcodeproj/project.pbxproj || true

      - name: Build App (Release - iphoneos)
        run: |
          xcodebuild -project GhostBrowser.xcodeproj \
            -scheme GhostBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GhostBrowser.app Payload/
          zip -qr GhostBrowser.ipa Payload
          echo "GhostBrowser.ipa packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowser-IPA
          path: GhostBrowser.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.5.1
          name: GhostBrowser v2.5.1 (Blank Page Elimination, Real Favicon Engine & Test Targets)
          body: |
            ## GhostBrowser v2.5.1 (Blank Page Elimination, Real Favicon Engine & Test Targets)
            - **Blank Screen Bug Elimination on Fingerprint.com**:
              - Fixed `createWebViewWith` popup handler: background scripts probing `window.open('about:blank')` no longer hijack or overwrite the active webView.
              - Added main-frame safeguard in `decidePolicyFor`: script-initiated `about:blank` navigations are blocked while active web sessions are loaded.
              - Added content blocker rule exemptions for test domains (`fingerprint.com`, `fingerprintjs.com`, `fingerprint-scan.com`) so first-party CDNs load seamlessly.
            - **Real Website Favicon (.ico) Engine**:
              - Tab bar capsules dynamically stream and display real website `.ico` / favicons using `AsyncImage` with smooth fallback to globe icons.
              - Home page test targets & favorites display their live genuine brand favicons with graceful offline monogram fallbacks.
            - **Integrated Test Target Suite**:
              - Added all 7 new requested bot and anti-detection test targets to the Start Page:
                - `https://fingerprint-scan.com/` (Hardware hash & Castle.io checks)
                - `https://browserinsight.net/bot-detection` (Bot & fraud detection)
                - `https://pixelscan.net/bot-check` (PixelScan bot checker)
                - `https://ipfighter.com/bot-detection` (Headless & focus detector)
                - `https://scrapfly.io/web-scraping-tools/automation-detector` (Scrapfly automation detection)
                - `https://pixelscan.dev/bot` (PixelScan dev bot tests)
                - `https://proxydetect.live/` (Proxy & network tests)
                - `https://fingerprint.com/demo/` (Fingerprint Pro demo)
                - `https://browserleaks.com/canvas` (BrowserLeaks canvas/WebGL)
                - `https://label-nutritional-chess-analysis.trycloudflare.com` (GhostDetect verification)
            - **Preserved Stealth Integrity**:
              - 0 tampering detection on `fingerprint.com` (Suspect Score: 0).
              - 0/100 Bot Score on `fingerprint-scan.com`.
              - Same-device visitor ID rotation preserved.
          files: GhostBrowser.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
