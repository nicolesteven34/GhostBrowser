name: Build GhostBrowser IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' -e 's/objectVersion = [0-9]*/objectVersion = 56/' GhostBrowser.xcodeproj/project.pbxproj || true

      - name: Build App (Release - iphoneos)
        run: |
          xcodebuild -project GhostBrowser.xcodeproj \
            -scheme GhostBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GhostBrowser.app Payload/
          zip -qr GhostBrowser.ipa Payload
          echo "GhostBrowser.ipa packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowser-IPA
          path: GhostBrowser.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.6.0
          name: GhostBrowser v2.6.0 (Enterprise Multi-Profile Architecture & Container Partitioning)
          body: |
            ## GhostBrowser v2.6.0 (Enterprise Multi-Profile Architecture & Container Partitioning)
            - **Native Multi-Profile Management Engine**:
              - Complete container isolation via persistent `WKWebsiteDataStore(forIdentifier:)` on iOS 17+.
              - Saved persistent profiles: each profile retains its own name, SF Symbol icon, color tint, independent cookie jar, cache, and open tabs across app launches.
              - Zero data leakage: switching between profiles instantly swaps storage containers without cross-contamination.
            - **Deterministic Hardware Personas Per Profile**:
              - Each profile binds to its own dedicated Apple Device Persona (iPad Pro M4, MacBook Pro M3, iPhone 15 Pro Max, etc.), hardware seed, and build index.
              - Hardware identities remain 100% bit-consistent on every visit to that profile.
            - **Safari-Style Profile Switcher UI**:
              - Top navigation bar profile pill (`[Icon] Name • Device`) with live theme color styling.
              - Native profile management sheet to switch profiles, create new profiles with custom icons/colors, roll seeds, or clear individual profile partitions.
            - **Preserved Stealth Integrity**:
              - 0 tampering detection on `fingerprint.com` (Suspect Score: 0).
              - 0/100 Bot Score on `fingerprint-scan.com`.
              - Same-device visitor ID rotation preserved.
          files: GhostBrowser.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
