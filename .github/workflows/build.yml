name: Build GhostBrowser IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App (Release - iphoneos)
        run: |
          xcodebuild -project GhostBrowser.xcodeproj \
            -scheme GhostBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GhostBrowser.app Payload/
          zip -qr GhostBrowser.ipa Payload
          echo "GhostBrowser.ipa packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowser-IPA
          path: GhostBrowser.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: GhostBrowser v1.0.0
          body: |
            ## GhostBrowser for iPadOS (v1.0.0)
            Unsigned `.ipa` ready for sideloading via Sideloadly or AltStore on Windows.

            - Download `GhostBrowser.ipa` below.
            - Open Sideloadly on your Windows PC, plug in your iPad, and drag this IPA into it.
          files: GhostBrowser.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
