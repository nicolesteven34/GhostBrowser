name: Build GhostBrowser IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' -e 's/objectVersion = [0-9]*/objectVersion = 56/' GhostBrowser.xcodeproj/project.pbxproj || true

      - name: Build App (Release - iphoneos)
        run: |
          xcodebuild -project GhostBrowser.xcodeproj \
            -scheme GhostBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GhostBrowser.app Payload/
          zip -qr GhostBrowser.ipa Payload
          echo "GhostBrowser.ipa packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowser-IPA
          path: GhostBrowser.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.7.0
          name: GhostBrowser v1.7.0 (Realistic Device Regeneration & In-Place Purge)
          body: |
            ## GhostBrowser v1.7.0 (Realistic Device Regeneration & In-Place Purge)
            - **Realistic Apple Device Rotation**: Tapping the Sparkles button now regenerates a complete, authentic Apple hardware profile (iPhone 15 Pro Max, iPad Pro 13" M4, MacBook Pro 16" M3 Max, iPad Air 11" M2, etc.).
            - **Synchronized Hardware Matrix**: Device Pixel Ratio (DPR 3.0 vs 2.0), Screen Dimensions (Logical CSS pixels), Platform (`iPhone`, `iPad`, `MacIntel`), Touch Points (`0`, `5`, `10`), CPU Cores (`6`, `8`, `10`, `16`), RAM, and WebGL GPU Renderers rotate synchronously.
            - **Native Code String Preservation**: Complete regex-compliant `[native code]` AST simulation for synthetic prototype getters, eliminating Tampering detection.
            - **In-Place Deep Session Purge**: Clears cookies, cache, and IndexedDB on identity change while reloading the current active URL in-place without kicking back to the start page.
            - **Clean HUD Toast**: Animated in-app notification confirming identity generation and active device profile.
          files: GhostBrowser.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
