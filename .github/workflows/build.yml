name: Build GhostBrowser IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' -e 's/objectVersion = [0-9]*/objectVersion = 56/' GhostBrowser.xcodeproj/project.pbxproj || true

      - name: Build App (Release - iphoneos)
        run: |
          xcodebuild -project GhostBrowser.xcodeproj \
            -scheme GhostBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GhostBrowser.app Payload/
          zip -qr GhostBrowser.ipa Payload
          echo "GhostBrowser.ipa packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowser-IPA
          path: GhostBrowser.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.7.0
          name: GhostBrowser v2.7.0 (Expanded Apple Persona Catalog, iPhone 16 / iOS 18, Dynamic Viewport Harmonization)
          body: |
            ## GhostBrowser v2.7.0
            - **Expanded Apple Persona Catalog (Latest Flagship Hardware & iOS 18)**:
              - **Native Host Device (100% Physical Match)**: Extracts and binds 1:1 to the host device's authentic screen geometry, DPR, core count, memory, and native WebKit User-Agent.
              - **iPhone 16 Pro Max (A18 Pro, iOS 18.1)**: Screen 440x956 @ 3.0x DPR, Apple A18 Pro GPU, 8GB RAM, 6 Cores.
              - **iPhone 16 (A18, iOS 18.0)**: Screen 393x852 @ 3.0x DPR, Apple A18 GPU, 8GB RAM, 6 Cores.
              - **MacBook Pro 16\" (M4 Max, macOS 15.1)**: Screen 1728x1117 @ 2.0x DPR, Apple M4 Max GPU, 36GB RAM, 16 Cores.
              - **MacBook Air 13\" (M3, macOS 15.0)**: Screen 1470x956 @ 2.0x DPR, Apple M3 GPU, 16GB RAM, 8 Cores.
              - **iPad Pro 13\" (M4, iPadOS 18.1)**: Screen 1024x1366 @ 2.0x DPR, Apple M4 GPU, 16GB RAM, 10 Cores.
              - Resilient backwards-compatible profile decoding for seamless profile migration.
            - **Dynamic Viewport Harmonization Safeguard**:
              - Automatically clamps `s.screen.width` and `s.screen.height` to at least `window.innerWidth` and `window.innerHeight`, mathematically preventing `window.innerWidth > screen.width` viewport leakage anomalies when running iPhone personas on iPad screens.
            - **Enterprise Multi-Profile Architecture**:
              - Container isolation via persistent `WKWebsiteDataStore(forIdentifier:)` on iOS 17+.
              - Per-profile tab isolation, cookie isolation, and deterministic hardware personas.
            - **Preserved Stealth Integrity**:
              - Suspect Score: 0 on `fingerprint.com`.
              - 0/100 Bot Score on `fingerprint-scan.com`.
          files: GhostBrowser.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
