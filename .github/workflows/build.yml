name: Build GhostBrowser IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' -e 's/objectVersion = [0-9]*/objectVersion = 56/' GhostBrowser.xcodeproj/project.pbxproj || true

      - name: Build App (Release - iphoneos)
        run: |
          xcodebuild -project GhostBrowser.xcodeproj \
            -scheme GhostBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GhostBrowser.app Payload/
          zip -qr GhostBrowser.ipa Payload
          echo "GhostBrowser.ipa packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowser-IPA
          path: GhostBrowser.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.0
          name: GhostBrowser v2.0.0 (Zero-Tampering Isolated Profile Architecture)
          body: |
            ## GhostBrowser v2.0.0 (Zero-Tampering Isolated Profile Architecture)
            - **Resolved Home Screen Glitch Loop**: Completely fixed navigation loops where `ghost-action://` URLs caused rapid counting glitching by adding dedicated `ghostNav` script message handlers and route guards.
            - **True Same-Device Unique Fingerprint**: Powered by iOS 17 `WKWebsiteDataStore(forIdentifier: UUID)` and SwiftUI `.id(sessionDataStoreID)` webview lifecycle recreation. Tapping "Generate New Identity (Keep Same Device)" tears down the old WebKit process, wipes all TLS session tickets and in-memory caches, and creates a fresh socket session.
            - **0 Tampering Detected**:
              - Native C++ Prototype Fidelity: Wrapper functions use ES6 method shorthand syntax with `hasOwnProperty('prototype') === false`, matching native browser methods bit-for-bit.
              - Screen Consistency: Removed artificial displayZoom overrides to ensure `window.innerWidth <= screen.width` at all times.
              - Native Audio Preservation: Unhooked AudioBuffer on Safari 17+, allowing Safari's genuine audio pipeline to execute without triggering audio tampering flags.
              - Multi-Dimension Canvas Seeding: Guarantees 100% bit-consistency (`hash1 === hash2`, 0 Artificial Noise) while delivering distinct canvas entropy per seed.
          files: GhostBrowser.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
