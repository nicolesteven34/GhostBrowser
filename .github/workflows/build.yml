name: Build FlagMeterBrowser IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' -e 's/objectVersion = [0-9]*/objectVersion = 56/' GhostBrowser.xcodeproj/project.pbxproj || true

      - name: Build App (Release - iphoneos)
        run: |
          xcodebuild -project GhostBrowser.xcodeproj \
            -scheme GhostBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GhostBrowser.app Payload/
          zip -qr FlagMeterBrowser.ipa Payload
          cp FlagMeterBrowser.ipa GhostBrowser.ipa
          echo "FlagMeterBrowser.ipa packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlagMeterBrowser-IPA
          path: FlagMeterBrowser.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v3.6.9
          name: FlagMeter Browser v3.6.9 (iPadOS / iOS Hardened Edition)
          body: |
            ## FlagMeter Browser v3.6.9 (iPadOS / iOS Hardened Edition)
            - Unified **FlagMeter Browser** branding & `flagmeter://detect` integration.
            - Multi-profile Cookie Backup & Restore (never converts host-only cookies into domain cookies).
            - Top-left aligned native Session Notes overlay (`UITextView`).
            - Background tab lifecycle & session resume harmonization.
          files: |
            FlagMeterBrowser.ipa
            GhostBrowser.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
