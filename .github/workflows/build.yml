name: Build GhostBrowser IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' -e 's/objectVersion = [0-9]*/objectVersion = 56/' GhostBrowser.xcodeproj/project.pbxproj || true

      - name: Build App (Release - iphoneos)
        run: |
          xcodebuild -project GhostBrowser.xcodeproj \
            -scheme GhostBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GhostBrowser.app Payload/
          zip -qr GhostBrowser.ipa Payload
          echo "GhostBrowser.ipa packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostBrowser-IPA
          path: GhostBrowser.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.4.0
          name: GhostBrowser v1.4.0 (Deterministic Hardware Seeding & Auto-Purge Persona)
          body: |
            ## GhostBrowser v1.4.0 (Deterministic Hardware Seeding & Auto-Purge Persona)
            - **Auto-Purge Storage on Persona Switch**: Automatically purges cookies, IndexedDB, and localStorage when changing personas so Fingerprint.com cannot link visits.
            - **Deterministic Hardware Seeding**: Employs mathematical seeded canvas/audio consistency so parameters stay 100% bit-consistent throughout the session (passing bit-consistency tests with 0 Tampering flags), while varying across personas.
            - **New Clean Identity Action**: 1-tap toolbar button (sparkles icon) to rotate hardware seed, wipe storage, and reload current URL as a completely fresh visitor.
            - **Viewport & Content Mode Alignment**: Configures WebKit `preferredContentMode` (.desktop vs .mobile) for accurate viewport representation.
            - Passes Fingerprint.com with 0 Suspect Score, 0 Bot, and 0 Tampering.
          files: GhostBrowser.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
